name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly re-run: catches newly published vulnerabilities in the image even when
  # no code changed (deploy jobs only run on pushes).
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its run in progress. Runs on master are never
# cancelled: one of them may be deploying.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[all]"

      - name: Lint
        run: ruff check .

      # Strict on the research and API code; Streamlit pages are covered by render tests.
      - name: Type check
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[all]"

      # Synthetic market data: no network or API keys. Fails under 90% coverage
      # (fail_under in pyproject.toml). Smoke tests skip: no deployment to hit.
      - name: Test
        run: pytest -q --cov --cov-report=term

  docker:
    name: Docker image
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GitHub Container Registry (master only)
    env:
      IMAGE: quant:ci
      REGISTRY_IMAGE: ghcr.io/jasonraza/quant
      # Pinned by digest: Trivy's release channels were briefly compromised in March 2026
      # (GHSA-69fq-xp46-6x23), so the scanner itself must be immutable.
      TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          docker build --tag "$IMAGE" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" .

      - name: Start API and dashboard containers
        run: |
          docker run --detach --name api --publish 8000:8000 "$IMAGE"
          docker run --detach --name dashboard --publish 8501:8501 \
            --env PORT=8501 --env HEALTH_PATH=/_stcore/health "$IMAGE" dashboard

      - name: Wait until healthy
        run: |
          for _ in $(seq 1 40); do
            api=$(docker inspect --format '{{.State.Health.Status}}' api)
            dash=$(docker inspect --format '{{.State.Health.Status}}' dashboard)
            echo "api=$api dashboard=$dash"
            [ "$api" = healthy ] && [ "$dash" = healthy ] && exit 0
            sleep 3
          done
          exit 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The same tests run after every deploy (staging, production).
      - name: Smoke tests against the containers
        env:
          QUANT_SMOKE_URL: http://localhost:8000
          QUANT_SMOKE_DASHBOARD_URL: http://localhost:8501
        run: |
          pip install httpx pytest
          pytest tests/smoke --noconftest -p no:cacheprovider -v

      - name: Container logs
        if: failure()
        run: docker logs api; docker logs dashboard

      # Audit exactly the packages that ship in the image.
      - name: Audit Python dependencies (pip-audit)
        run: |
          docker run --rm --entrypoint python "$IMAGE" -c \
            "import importlib.metadata as m; print('\n'.join(f'{d.metadata[\"Name\"]}=={d.version}' for d in m.distributions()))" \
            > shipped-requirements.txt
          pip install pip-audit
          pip-audit --requirement shipped-requirements.txt --no-deps --disable-pip

      - name: Scan image (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 "$IMAGE"

      # Only the image that passed every check above is published, tagged with its commit.
      - name: Publish image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE" "$REGISTRY_IMAGE:${{ github.sha }}"
          docker push "$REGISTRY_IMAGE:${{ github.sha }}"

  deploy-staging:
    name: Staging
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/deploy.yml
    permissions:
      id-token: write
      contents: read
    with:
      environment: staging
      image: ghcr.io/jasonraza/quant:${{ github.sha }}

  # Same image, promoted only if staging deployed and passed its smoke tests.
  deploy-production:
    name: Production
    needs: deploy-staging
    uses: ./.github/workflows/deploy.yml
    permissions:
      id-token: write
      contents: read
    with:
      environment: production
      image: ghcr.io/jasonraza/quant:${{ github.sha }}
