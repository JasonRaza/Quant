[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-portfolio"
version = "0.1.0"
description = "Python quant finance portfolio: data pipeline, backtester, factors, portfolio optimization, ML alpha, paper trading"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "yfinance>=0.2.36",
]

[project.optional-dependencies]
backtest = [
    "matplotlib>=3.7",
]
factors = [
    "scipy>=1.11",
]
portfolio = [
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "cvxpy>=1.4",
]
ml = [
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
]
paper = [
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "streamlit>=1.30",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]
all = [
    "quant-portfolio[backtest,factors,portfolio,ml,paper,dev]",
]

[project.scripts]
quant-fetch = "data_pipeline.cli:main"
quant-backtest = "backtester.cli:main"
quant-quality = "data_pipeline.quality:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["data_pipeline*", "backtester*", "factors*", "portfolio*", "ml_alpha*", "paper_trading*", "shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
