[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-portfolio"
version = "0.1.0"
description = "Learning project: a small quant research stack, from market data to backtests, factors, portfolio optimization, ML and paper trading"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "JasonRaza" }]
keywords = ["quantitative-finance", "backtesting", "portfolio-optimization", "machine-learning", "streamlit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "yfinance>=0.2.36",
]

[project.optional-dependencies]
backtest = [
    "matplotlib>=3.7",
]
factors = [
    "scipy>=1.11",
]
portfolio = [
    "scipy>=1.11",
]
ml = [
    "quant-portfolio[factors]",
    "scikit-learn>=1.3",
]
paper = [
    "quant-portfolio[backtest,portfolio,ml]",
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "streamlit>=1.50",
]
dev = [
    "scikit-learn>=1.3",  # reference implementation checked in tests
    "httpx>=0.27",  # FastAPI TestClient
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "pre-commit>=3.0",
]
all = [
    "quant-portfolio[backtest,factors,portfolio,ml,paper,dev]",
]

[project.urls]
Repository = "https://github.com/JasonRaza/Quant"

[project.scripts]
quant-fetch = "data_pipeline.cli:main"
quant-backtest = "backtester.cli:main"
quant-quality = "data_pipeline.quality:main"
quant-factors = "factors.cli:main"
quant-optimize = "portfolio.cli:main"
quant-paper-api = "paper_trading.api:main"
quant-dashboard = "paper_trading.launch:main"
quant-ml = "ml_alpha.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["data_pipeline*", "backtester*", "factors*", "portfolio*", "ml_alpha*", "paper_trading*", "shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["data_pipeline", "backtester", "factors", "portfolio", "ml_alpha", "paper_trading", "shared"]

[tool.coverage.report]
skip_empty = true
show_missing = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
