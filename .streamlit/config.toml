# Visual theme for the Streamlit app (tutorial + Lab).

[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6F6"
textColor = "#1C2B33"
linkColor = "#0F766E"
greenColor = "#15803D"
redColor = "#B42318"
orangeColor = "#C2410C"
blueColor = "#1D4ED8"
borderColor = "#E2E8EA"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0.6rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
chartCategoricalColors = ["#0F766E", "#D97706", "#4F46E5", "#B42318", "#0891B2", "#65A30D", "#9333EA", "#64748B", "#DB2777", "#78716C"]

[theme.sidebar]
backgroundColor = "#F3F6F6"

[client]
toolbarMode = "minimal"
