# Local stack: docker compose up --build
#   API:       http://localhost:8000/docs
#   Dashboard: http://localhost:8501
services:
  api:
    build: .
    image: quant:local
    command: ["api"]
    ports:
      - "8000:8000"
    volumes:
      - paper-data:/app/var

  dashboard:
    build: .
    image: quant:local
    command: ["dashboard"]
    environment:
      PORT: "8501"
      HEALTH_PATH: /_stcore/health
    ports:
      - "8501:8501"

volumes:
  paper-data:
